name: Gerar dados e publicar site

on:
  workflow_dispatch:
    inputs:
      anos:
        description: "Restringir a alguns anos (ex.: 2022,2024). Vazio = todos"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "site/**"
      - "requirements.txt"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar dados brutos do TSE (release dados-tse)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download dados-tse --dir raw --pattern "*.zip"

      - name: Processar
        run: python scripts/build.py --raw raw --out site/data --anos "${{ inputs.anos }}"

      - name: Tamanho da saída
        run: du -sh site/data site/data/* && find site/data -type f | wc -l

      - name: Versionar app.js e style.css (evita cache antigo após deploy)
        run: sed -i "s/app\.js\"/app.js?v=${GITHUB_SHA::8}\"/; s/style\.css\"/style.css?v=${GITHUB_SHA::8}\"/" site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
